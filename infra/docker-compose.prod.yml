services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csgateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: csgateway
      POSTGRES_USER: csgateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:-csgateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csgateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — internal only

  redis:
    image: redis:7-alpine
    container_name: csgateway-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-csgateway}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-csgateway}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — internal only

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: csgateway-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
    command: >
      bash -c "
        cd /app &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # No ports exposed — internal only

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
        - NEXT_PUBLIC_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    container_name: csgateway-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # No ports exposed — internal only

  caddy:
    image: caddy:2-alpine
    container_name: csgateway-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP → HTTPS redirect
      - "443:443"    # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
